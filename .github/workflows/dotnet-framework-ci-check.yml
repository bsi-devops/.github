name: .NET Framework CI (Reusable)

on:
  workflow_call:
    inputs:
      runner-group:
        description: "Runner group name"
        required: true
        type: string

      runner-labels:
        description: "Runner labels (JSON array string)"
        required: true
        type: string

      fail-on-dependabot-alerts:
        description: "Fail if open Dependabot alerts exist"
        required: false
        default: true
        type: boolean

      fail-on-secret-scanning-alerts:
        description: "Fail if open Secret Scanning alerts exist"
        required: false
        default: true
        type: boolean
    secrets:
      SECURITY_REPORTS_APP_PRIVATE_KEY:
        description: "GitHub App private key for security reports"
        required: true 

      PACKAGES_APP_PRIVATE_KEY:
        description: "GitHub App private key for packages"
        required: true
              
permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  build-test-and-security:
    runs-on:
      group: ${{ inputs.runner-group }}
      labels: ${{ fromJson(inputs.runner-labels) }}

    steps:
    # --- Checkout ---
    - name: Checkout
      uses: actions/checkout@v4

    # --- Setup NuGet ---
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # --- Setup MSBuild ---
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # --- Generate Packages App token ---
    - name: Generate Packages App token
      id: packages-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.PACKAGES_APP_ID }}
        private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}

    # --- Configure GitHub-BSI NuGet source ---
    - name: Configure GitHub-BSI NuGet source
      shell: pwsh
      env:
        NUGET_AUTH_TOKEN: ${{ steps.packages-token.outputs.token }}
      run: |
        nuget sources Remove -Name "GitHub-BSI" -ErrorAction SilentlyContinue

        nuget sources Add `
          -Name "GitHub-BSI" `
          -Source "https://nuget.pkg.github.com/bsi-devops/index.json" `
          -Username "x-access-token" `
          -Password $env:NUGET_AUTH_TOKEN `
          -StorePasswordInClearText

    # --- Restore ---
    - name: Restore dependencies
      shell: pwsh
      run: |
        $solutions = Get-ChildItem -Path . -Filter *.sln -Recurse

        if (-not $solutions) {
          throw "No solution files (*.sln) found."
        }

        foreach ($solution in $solutions) {
          nuget restore $solution.FullName
        }

    # --- CodeQL Init ---
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    # --- Build ---
    - name: Build
      shell: pwsh
      run: |
        $solutions = Get-ChildItem -Path . -Filter *.sln -Recurse

        if (-not $solutions) {
          throw "No solution files (*.sln) found."
        }

        foreach ($solution in $solutions) {
          msbuild $solution.FullName /m /p:Configuration=Release
        }

    # --- Test ---
    - name: Test
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vstest = & $vswhere -latest -products * -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'

        if (-not $vstest) {
          throw "vstest.console.exe was not found."
        }

        $testAssemblies = Get-ChildItem -Path . -Recurse -Include *Tests.dll,*Test.dll |
          Where-Object {
            $_.FullName -notmatch '\\obj\\' -and
            $_.FullName -notmatch '\\ref\\' -and
            $_.FullName -notmatch '\\packages\\'
          }

        if (-not $testAssemblies) {
          Write-Host 'No test assemblies found. Skipping test execution.'
          exit 0
        }

        & $vstest $testAssemblies.FullName

    # --- CodeQL Analyze ---
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # --- Generate GitHub App token ---
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.SECURITY_REPORTS_APP_ID }}
        private-key: ${{ secrets.SECURITY_REPORTS_APP_PRIVATE_KEY }}

    # --- Dependabot Alerts ---

    - name: Check Dependabot alerts
      if: inputs.fail-on-dependabot-alerts
      uses: actions/github-script@v7
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const alerts = await github.request(
            'GET /repos/{owner}/{repo}/dependabot/alerts',
            { owner: context.repo.owner, repo: context.repo.repo }
          );

          if (alerts.data.length > 0) {
            core.setFailed(`There are ${alerts.data.length} open Dependabot alerts`);
          }
            
    # --- Secret Scanning Alerts ---
    - name: Check Secret Scanning alerts
      if: inputs.fail-on-secret-scanning-alerts
      uses: actions/github-script@v7
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const alerts = await github.request(
            'GET /repos/{owner}/{repo}/secret-scanning/alerts',
            { owner: context.repo.owner, repo: context.repo.repo }
          );

          if (alerts.data.some(a => a.state === "open")) {
            core.setFailed("Open secret scanning alerts found");
          }
