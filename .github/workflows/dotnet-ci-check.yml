name: .NET CI (Reusable)

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to use"
        required: true
        type: string

      dotnet-quality:
        type: string
        required: false
        default: 'ga'

      runner-group:
        description: "Runner group name"
        required: true
        type: string

      runner-labels:
        description: "Runner labels (JSON array string)"
        required: true
        type: string

      fail-on-dependabot-alerts:
        description: "Fail if open Dependabot alerts exist"
        required: false
        default: true
        type: boolean

      fail-on-secret-scanning-alerts:
        description: "Fail if open Secret Scanning alerts exist"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  build-test-and-security:
    runs-on:
      group: ${{ inputs.runner-group }}
      labels: ${{ fromJson(inputs.runner-labels) }}

    steps:
    # --- Checkout ---
    - name: Checkout
      uses: actions/checkout@v4

    # --- .NET install dir fix ---
    - name: Set writable .NET install dir
      shell: bash
      run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> $GITHUB_ENV

    # --- Setup .NET ---
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        dotnet-quality: ${{ inputs.dotnet-quality }}

    # --- CodeQL Init (build előtt kötelező) ---
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    # 🔥 --- CI solution generálás (mert nem bír slnx-ből dolgozni, ha az van a projektben) ---
    - name: Generate CI solution
      run: |
        dotnet new sln -n ci
        for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
          dotnet sln ci.sln add "$proj"
        done

    # --- Restore ---
    - name: Restore dependencies
      run: dotnet restore ci.sln

    # --- Linting ---
    - name: Check Formatting (Linting)
      run: dotnet format --verify-no-changes

    # --- Build (CodeQL ezt capture-eli) ---
    - name: Build
      run: dotnet build ci.sln --no-restore --configuration Release

    # --- Test ---
    - name: Test
      run: dotnet test ci.sln --configuration Release --no-build --verbosity normal

    # --- CodeQL Analyze ---
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # --- Dependabot Alerts ---
    - name: Check Dependabot alerts
      if: inputs.fail-on-dependabot-alerts
      uses: actions/github-script@v7
      with:
        script: |
          const alerts = await github.request(
            'GET /repos/{owner}/{repo}/dependabot/alerts',
            { owner: context.repo.owner, repo: context.repo.repo }
          );

          if (alerts.data.length > 0) {
            core.setFailed(`There are ${alerts.data.length} open Dependabot alerts`);
          }

    # --- Secret Scanning Alerts ---
    - name: Check Secret Scanning alerts
      if: inputs.fail-on-secret-scanning-alerts
      uses: actions/github-script@v7
      with:
        script: |
          const alerts = await github.request(
            'GET /repos/{owner}/{repo}/secret-scanning/alerts',
            { owner: context.repo.owner, repo: context.repo.repo }
          );

          if (alerts.data.some(a => a.state === "open")) {
            core.setFailed("Open secret scanning alerts found");
          }
