name: .NET CI Check

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  security-events: write

permissions:
  contents: read
  security-events: write

jobs:
  build-test-and-security:
    if: github.repository != 'bsi-devops/.github'
    runs-on: ubuntu-latest

    steps:
    # --- Checkout ---
    - uses: actions/checkout@v4

    # --- Setup .NET ---
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # --- Restore ---
    - name: Restore dependencies
      run: dotnet restore

    # --- Linting ---
    - name: Check Formatting (Linting)
      run: dotnet format --verify-no-changes

    # --- Build ---
    - name: Build
      run: dotnet build --no-restore --configuration Release

    # --- Test ---
    - name: Test
      run: dotnet test --no-build --verbosity normal

    # --- CodeQL Init ---
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    # --- CodeQL Autobuild ---
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # --- CodeQL Analyze ---
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # --- Dependabot Alerts ---
    - name: Check Dependabot alerts
      uses: actions/github-script@v7
      with:
        script: |
          const alerts = await github.request('GET /repos/{owner}/{repo}/dependabot/alerts', {
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          if (alerts.data.length > 0) {
            core.setFailed(`There are ${alerts.data.length} open Dependabot alerts`);
          }

    # --- Secret Scanning Alerts ---
    - name: Check Secret Scanning alerts
      uses: actions/github-script@v7
      with:
        script: |
          const alerts = await github.request('GET /repos/{owner}/{repo}/secret-scanning/alerts', {
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          if (alerts.data.some(a => a.state === "open")) {
            core.setFailed("Open secret scanning alerts found");
          }
