name: .NET CI (Reusable)

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: ".NET SDK version to use"
        required: true
        type: string

      dotnet-quality:
        type: string
        required: false
        default: 'ga'

      runner-group:
        description: "Runner group name"
        required: true
        type: string

      runner-labels:
        description: "Runner labels (JSON array string)"
        required: true
        type: string

      format-workspace:
        description: "Workspace path for dotnet format (optional override)"
        required: false
        default: ''
        type: string

      fail-on-dependabot-alerts:
        description: "Fail if open Dependabot alerts exist"
        required: false
        default: true
        type: boolean

      fail-on-secret-scanning-alerts:
        description: "Fail if open Secret Scanning alerts exist"
        required: false
        default: true
        type: boolean

    
    secrets:
      SECURITY_REPORTS_APP_PRIVATE_KEY:
        description: "GitHub App private key for security reports"
        required: true

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  build-test-and-security:
    runs-on:
      group: ${{ inputs.runner-group }}
      labels: ${{ fromJson(inputs.runner-labels) }}

    steps:
    # --- Checkout ---
    - name: Checkout
      uses: actions/checkout@v4

    # --- .NET install dir fix ---
    - name: Set writable .NET install dir
      shell: bash
      run: echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> $GITHUB_ENV

    # --- Setup .NET ---
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        dotnet-quality: ${{ inputs.dotnet-quality }}

    # --- CodeQL Init ---
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    # --- Configure GitHub Packages NuGet source ---
    - name: Configure GitHub-BSI NuGet source
      shell: bash
      run: |
        dotnet nuget remove source GitHub-BSI || true

        dotnet nuget add source "https://nuget.pkg.github.com/bsi-devops/index.json" \
          --name "GitHub-BSI" \
          --username ${{ github.actor }} \
          --password ${{ secrets.GITHUB_TOKEN }} \
          --store-password-in-clear-text

    - name: Resolve .NET workspace
      id: resolve_workspace
      shell: bash
      run: |
        workspace="${{ inputs.format-workspace }}"

        if [ -n "$workspace" ] && [ ! -e "$workspace" ]; then
          echo "Configured format-workspace does not exist: $workspace"
          exit 1
        fi

        if [ -z "$workspace" ]; then
          slnx_count=$(find . -maxdepth 1 -type f -name "*.slnx" | wc -l)
          sln_count=$(find . -maxdepth 1 -type f -name "*.sln" | wc -l)
          csproj_count=$(find . -maxdepth 1 -type f -name "*.csproj" | wc -l)

          if [ "$slnx_count" -gt 0 ]; then
            workspace=$(find . -maxdepth 1 -type f -name "*.slnx" | sort | head -n 1)
          elif [ "$sln_count" -gt 0 ]; then
            workspace=$(find . -maxdepth 1 -type f -name "*.sln" | sort | head -n 1)
          elif [ "$csproj_count" -eq 1 ]; then
            workspace=$(find . -maxdepth 1 -type f -name "*.csproj" | head -n 1)
          fi
        fi

        echo "workspace=$workspace" >> "$GITHUB_OUTPUT"

        if [ -n "$workspace" ]; then
          echo "Resolved workspace: $workspace"
        else
          echo "No explicit workspace resolved; dotnet default discovery will be used."
        fi

    # --- Restore ---
    - name: Restore dependencies
      shell: bash
      run: |
        workspace="${{ steps.resolve_workspace.outputs.workspace }}"

        if [ -n "$workspace" ]; then
          dotnet restore "$workspace"
        else
          dotnet restore
        fi

    # --- Linting ---
    - name: Check Formatting (Linting)
      shell: bash
      run: |
        workspace="${{ steps.resolve_workspace.outputs.workspace }}"

        if [ -n "$workspace" ]; then
          echo "Running dotnet format on workspace: $workspace"
          dotnet format "$workspace" --verify-no-changes
        else
          echo "No preferred workspace found, using default dotnet format discovery."
          dotnet format --verify-no-changes
        fi

    # --- Build ---
    - name: Build (all projects)
      shell: bash
      run: |
        workspace="${{ steps.resolve_workspace.outputs.workspace }}"

        if [ -n "$workspace" ]; then
          dotnet build "$workspace" --configuration Release --no-restore
        else
          find . -name "*.csproj" \
            -not -path "*/obj/*" \
            -not -path "*/bin/*" \
            -exec dotnet build {} --configuration Release --no-restore \;
        fi

    # --- Test ---
    - name: Test
      shell: bash
      run: |
        workspace="${{ steps.resolve_workspace.outputs.workspace }}"

        if [ -n "$workspace" ]; then
          dotnet test "$workspace" --configuration Release --no-build --verbosity normal
        else
          dotnet test --configuration Release --no-build --verbosity normal
        fi

    # 🔥 CodeQL (PR-ben skip → nincs permission error)
    - name: Perform CodeQL Analysis
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/analyze@v3

    # --- Generate GitHub App token (non-PR only) ---
    - name: Generate GitHub App token
      if: github.event_name != 'pull_request'
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.SECURITY_REPORTS_APP_ID }}
        private-key: ${{ secrets.SECURITY_REPORTS_APP_PRIVATE_KEY }}

    # =============================
    # 🔥 Dependabot fallback
    # =============================
    - name: Check Dependabot alerts (safe)
      if: inputs.fail-on-dependabot-alerts
      uses: actions/github-script@v7
      continue-on-error: true
      id: dependabot_check
      with:
        github-token: ${{ github.event_name != 'pull_request' && steps.app-token.outputs.token || github.token }}
        script: |
          try {
            const alerts = await github.request(
              'GET /repos/{owner}/{repo}/dependabot/alerts',
              { owner: context.repo.owner, repo: context.repo.repo }
            );

            const count = alerts.data.length;
            core.setOutput("count", count);
            console.log(`Dependabot alerts: ${count}`);
          } catch (err) {
            console.log("⚠️ Could not fetch Dependabot alerts.");
            console.log(err.status);
            core.setOutput("count", "unknown");
          }

    - name: Fail on Dependabot alerts (non-PR)
      if: inputs.fail-on-dependabot-alerts && github.event_name != 'pull_request'
      run: |
        if [ "${{ steps.dependabot_check.outputs.count }}" != "0" ] && [ "${{ steps.dependabot_check.outputs.count }}" != "unknown" ]; then
          echo "Dependabot alerts found!"
          exit 1
        fi

    # =============================
    # 🔥 Secret scanning fallback
    # =============================
    - name: Check Secret Scanning alerts (safe)
      if: inputs.fail-on-secret-scanning-alerts
      uses: actions/github-script@v7
      continue-on-error: true
      id: secret_check
      with:
        github-token: ${{ github.event_name != 'pull_request' && steps.app-token.outputs.token || github.token }}
        script: |
          try {
            const alerts = await github.request(
              'GET /repos/{owner}/{repo}/secret-scanning/alerts',
              { owner: context.repo.owner, repo: context.repo.repo }
            );

            const openAlerts = alerts.data.filter(a => a.state === "open").length;
            core.setOutput("count", openAlerts);
            console.log(`Open secret alerts: ${openAlerts}`);
          } catch (err) {
            console.log("⚠️ Could not fetch secret scanning alerts.");
            console.log(err.status);
            core.setOutput("count", "unknown");
          }

    - name: Fail on Secret alerts (non-PR)
      if: inputs.fail-on-secret-scanning-alerts && github.event_name != 'pull_request'
      run: |
        if [ "${{ steps.secret_check.outputs.count }}" != "0" ] && [ "${{ steps.secret_check.outputs.count }}" != "unknown" ]; then
          echo "Open secret scanning alerts found!"
          exit 1
        fi

    - name: PR Summary Report
      if: always()
      run: |
        echo "# ✅ .NET CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        DEP="${{ steps.dependabot_check.outputs.count }}"
        SEC="${{ steps.secret_check.outputs.count }}"

        echo "## 🔐 Security Checks" >> $GITHUB_STEP_SUMMARY

        if [ "$DEP" = "0" ]; then
          echo "- ✅ Dependabot: no alerts" >> $GITHUB_STEP_SUMMARY
        elif [ "$DEP" = "unknown" ]; then
          echo "- ⚠️ Dependabot: unknown (no permission)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Dependabot: $DEP alerts" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "$SEC" = "0" ]; then
          echo "- ✅ Secret scanning: clean" >> $GITHUB_STEP_SUMMARY
        elif [ "$SEC" = "unknown" ]; then
          echo "- ⚠️ Secret scanning: unknown (no permission)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Secret scanning: $SEC alerts" >> $GITHUB_STEP_SUMMARY
        fi
